[package]
name = "validation-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Offline harmless synthetic event and validation corpus for AegisGuard"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }

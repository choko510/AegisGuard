# cargo-deny policy (run in CI by the supply-chain job).
[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerabilities and unmaintained crates fail CI.
yanked = "deny"

[licenses]
# Permissive licenses only. GPL/AGPL/LGPL code is not allowed (ADOPTION_MATRIX.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# AegisGuard itself has no license chosen yet (owner decision).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

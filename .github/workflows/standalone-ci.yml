name: Standalone Rust Audit CI

on:
  pull_request:
    paths:
      - "standalone/**"
      - ".github/workflows/standalone-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-crates:
    name: Check standalone on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Validate independent Cargo crates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in standalone/*/Cargo.toml; do
            echo "::group::${manifest}"
            cargo fmt --manifest-path "${manifest}" --all -- --check
            cargo clippy --locked --manifest-path "${manifest}" --all-targets -- -D warnings
            cargo test --locked --manifest-path "${manifest}" --all-targets
            cargo build --release --locked --manifest-path "${manifest}"
            echo "::endgroup::"
          done

[package]
name = "aegisguard"
version = "0.1.0"
edition = "2021"
description = "Windows-first, Defender-compatible static threat triage toolkit"
repository = "https://github.com/choko510/AegisGuard"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
flate2 = "1"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
# Modules are disabled: AegisGuard rules may not import any module, so the
# PE/ELF/.NET/ZIP/etc. parsers and their dependencies are not compiled in.
yara-x = { version = "1.22.1", optional = true, default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "generate-proto-code"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
# In-process YARA-X scanning (audit only). Requires Rust >= 1.95, the MSRV of
# yara-x; the default build keeps rust-version 1.85.
yara = ["dep:yara-x"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

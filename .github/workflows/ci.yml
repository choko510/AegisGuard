name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-run so dependency advisories and runner image changes surface.
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (tag in the comment).
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets

  yara:
    # Optional in-process YARA-X engine (feature `yara`, needs Rust >= 1.95).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (yara)
        run: cargo clippy --locked --all-targets --features yara -- -D warnings
      - name: Tests (yara)
        run: cargo test --locked --all-targets --features yara
      - name: Repository rules pass the gate
        run: cargo run --locked --features yara -- rules check rules/aegisguard

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build with the declared rust-version
        run: cargo check --locked --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-cyclonedx
      - name: Licenses, advisories, bans and sources
        run: cargo deny --locked check
      - name: License inventory and SBOM
        run: |
          mkdir -p supply-chain
          cargo deny --locked list --format tsv > supply-chain/licenses.tsv
          cargo cyclonedx --format json --override-filename aegisguard.cdx
          mv aegisguard.cdx.json supply-chain/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: supply-chain/

  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary and synthetic corpus
        shell: bash
        run: |
          cargo build --locked --release
          cargo run --locked --release --example bench_corpus -- generate bench/corpus
      - name: Measure (Linux)
        if: runner.os == 'Linux'
        run: |
          /usr/bin/time -v ./target/release/aegisguard scan bench/corpus --recursive \
            > bench/scan.jsonl 2> bench/time.txt
          grep -E "Elapsed|Maximum resident|User time|System time" bench/time.txt | tee bench/metrics.txt
      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath .\target\release\aegisguard.exe `
            -ArgumentList 'scan','bench\corpus','--recursive' `
            -RedirectStandardOutput bench\scan.jsonl -RedirectStandardError bench\stderr.txt `
            -NoNewWindow -PassThru
          $peak = 0
          while (-not $p.HasExited) {
            try { $p.Refresh(); $peak = [Math]::Max($peak, $p.PeakWorkingSet64) } catch {}
            Start-Sleep -Milliseconds 20
          }
          $sw.Stop()
          "Elapsed (ms): $($sw.ElapsedMilliseconds)" | Tee-Object bench\metrics.txt
          "Peak working set sampled (KiB): $([int]($peak / 1024))" | Tee-Object -Append bench\metrics.txt
          "CPU time (ms): $([int]$p.TotalProcessorTime.TotalMilliseconds)" | Tee-Object -Append bench\metrics.txt
      - name: Outcome table
        shell: bash
        run: |
          cargo run --locked --release --example bench_corpus -- summarize bench/scan.jsonl > bench/outcomes.md
          {
            echo "## Baseline on ${{ runner.os }} (synthetic corpus, GitHub-hosted runner)"
            echo '```'; cat bench/metrics.txt; echo '```'
            cat bench/outcomes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: False-positive / miss gate (synthetic corpus, P5-02)
        shell: bash
        run: cargo run --locked --release --example bench_corpus -- summarize --check bench/scan.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ runner.os }}
          path: |
            bench/metrics.txt
            bench/outcomes.md

[package]
name = "aegisguard"
version = "0.1.0"
edition = "2021"
description = "Windows-first, Defender-compatible static threat triage toolkit"
repository = "https://github.com/choko510/AegisGuard"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
quick-xml = "0.41"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
# Modules are disabled: AegisGuard rules may not import any module, so the
# PE/ELF/.NET/ZIP/etc. parsers and their dependencies are not compiled in.
yara-x = { version = "1.22.1", optional = true, default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "generate-proto-code"] }

[workspace]
# The GUI is a separate member with its own rust-version (eframe needs 1.95);
# plain `cargo build/test` at the root still builds only the CLI and library.
members = [".", "apps/aegis-ui"]
default-members = ["."]

# The GUI test binary otherwise exceeds the MSVC PDB size limit (LNK1140);
# dependencies keep line tables, AegisGuard's own crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
# In-process YARA-X scanning (audit only). Requires Rust >= 1.95, the MSRV of
# yara-x; the default build keeps rust-version 1.85.
yara = ["dep:yara-x"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_Registry", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

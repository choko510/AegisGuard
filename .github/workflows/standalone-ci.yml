name: Standalone Rust Audit CI

on:
  pull_request:
    paths:
      - "standalone/**"
      - ".github/workflows/standalone-ci.yml"
  push:
    branches: [main]
    paths:
      - "standalone/**"
      - ".github/workflows/standalone-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-audits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Rust standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check every independent Cargo package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for manifest in standalone/*/Cargo.toml; do
            count=$((count + 1))
            echo "::group::Checking ${manifest}"
            cargo generate-lockfile --manifest-path "${manifest}"
            cargo fmt --manifest-path "${manifest}" --all
            echo 'AEGIS_FORMAT_PATCH_BEGIN'
            git --no-pager diff --no-ext-diff --no-color --unified=3 -- standalone/
            echo 'AEGIS_FORMAT_PATCH_END'
            cargo fmt --manifest-path "${manifest}" --all -- --check
            cargo clippy --locked --manifest-path "${manifest}" --all-targets -- -D warnings
            cargo test --locked --manifest-path "${manifest}" --all-targets
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cargo build --locked --manifest-path "${manifest}" --release
            fi
            echo "::endgroup::"
          done
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::No standalone Cargo packages found"
            exit 1
          fi
      - name: Upload rustfmt-normalized source for review
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatted-standalone-sources
          path: |
            standalone/*/src/*.rs
            standalone/*/tests/*.rs
            standalone/*/Cargo.lock
          if-no-files-found: error
      - name: Check PowerShell source syntax (no execution)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path standalone -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($errorItem in $parseErrors) { Write-Error $errorItem.ToString() }
              throw "PowerShell syntax errors in $($_.FullName)"
            }
          }
